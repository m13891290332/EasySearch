<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasySearch 知识库管理</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="container kb-page">
    <header class="brand">
      <h1>知识库管理</h1>
      <p class="tagline">导入 / 导出 / 版本回滚 / Embedding 状态</p>
      <p class="nav-links"><a href="/">返回搜索</a></p>
    </header>

    <!-- Embedding 状态卡 -->
    <section class="kb-card">
      <h3>当前状态</h3>
      <div id="emb-status" class="emb-status">
        <span class="emb-item">服务总数：<b id="emb-total">—</b></span>
        <span class="emb-item">已向量化：<b id="emb-embedded">—</b></span>
        <span class="emb-item">重建中：<b id="emb-in-progress">—</b></span>
        <span class="emb-item">KB Hash：<code id="emb-hash">—</code></span>
        <span class="emb-item emb-error" id="emb-error-wrap" hidden>错误：<span id="emb-error"></span></span>
      </div>
      <button id="refresh-status-btn" type="button" class="btn btn-secondary">刷新状态</button>
    </section>

    <!-- 导入区 -->
    <section class="kb-card">
      <h3>导入知识库</h3>
      <p class="kb-hint">拖拽 JSON 文件到下方区域，或点击选择文件。JSON 须为服务记录数组。</p>
      <div id="dropzone" class="dropzone">
        <p class="dropzone-text">拖拽 JSON 文件到此处<br />或点击选择文件</p>
        <input id="file-input" type="file" accept=".json,application/json" hidden />
      </div>
      <div id="import-result" class="import-result" hidden></div>
      <div id="import-progress" class="import-progress" hidden>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <span id="progress-text">导入中…</span>
      </div>
    </section>

    <!-- 导出区 -->
    <section class="kb-card">
      <h3>导出知识库</h3>
      <p class="kb-hint">下载当前生效知识库为 JSON 文件，可重新导入且 embedding hash 一致。</p>
      <button id="export-btn" type="button" class="btn btn-primary">导出当前 KB</button>
    </section>

    <!-- 版本列表 -->
    <section class="kb-card">
      <h3>版本历史</h3>
      <p class="kb-hint">active 标记当前生效版本；点击「回滚」切换到历史版本。</p>
      <table class="kb-table">
        <thead>
          <tr>
            <th>版本ID</th>
            <th>KB Hash</th>
            <th>创建时间</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="versions-body"></tbody>
      </table>
      <button id="refresh-versions-btn" type="button" class="btn btn-secondary">刷新版本列表</button>
    </section>
  </main>

  <script src="/static/kb.js"></script>
</body>
</html>
